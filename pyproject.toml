[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapsteal"
version = "1.0.0"
description = "MapSteal (structured recursive Teacher-driven knowledge acquisition, corpus construction, Student adaptation, evaluation) with the QEDKS-Adapted, EvoKD-Adapted and Pristine baselines"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
acquire = ["openai>=1.0"]
gpu = ["torch==2.13.0", "transformers==5.14.1", "peft==0.19.1", "safetensors", "accelerate"]
display = ["rich"]
qedks = ["openai>=1.0", "numpy", "scikit-learn", "sentence-transformers", "Levenshtein", "rapidfuzz", "torch==2.13.0", "transformers==5.14.1", "peft==0.19.1", "safetensors", "accelerate"]
evokd = ["openai>=1.0", "torch==2.13.0", "transformers==5.14.1", "peft==0.19.1", "safetensors", "accelerate"]

[project.scripts]
mapsteal = "mapsteal.cli:main"
baselines = "baselines.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mapsteal = ["data/**/*"]
